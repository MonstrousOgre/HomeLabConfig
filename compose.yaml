name: kashlab

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SERVER_DATA}/portainer:/data
    ports:
      - 9000:9000
      - 9443:9443
      # - 8000:8000  # Remove if you do not intend to use Edge Agents
    networks:
      - caddy-private

  linkding:
    container_name: "${LD_CONTAINER_NAME:-linkding}"
    image: sissbruecker/linkding:latest
    # ports:
    #   - "${LD_HOST_PORT:-9090}:9090"
    volumes:
      - "${LD_HOST_DATA_DIR:-${SERVER_DATA}/linkding}:/etc/linkding/data"
    restart: unless-stopped
    networks:
      - cloudflare-public

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - run
      - --token
      - ${CLOUDFLARE_TOKEN}
    networks:
      - cloudflare-public

  caddy:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.caddy   # Explicitly name your Caddy Dockerfile
    container_name: caddy
    image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      # - ${SERVER_CONFIG}/config/caddy:/etc/caddy:ro
      - ./config/caddy:/etc/caddy:ro
      - ${SERVER_DATA}/caddy/data:/data
      - ${SERVER_DATA}/caddy/config:/config
    networks:
      - caddy-private

  readeck:
    image: codeberg.org/readeck/readeck:latest
    container_name: readeck
    # ports:
    #   - 8000:8000
    environment:
      # Defines the application log level. Can be error, warn, info, debug.
      READECK_LOG_LEVEL: info
      # The IP address on which Readeck listens.
      READECK_SERVER_HOST: "0.0.0.0"
      # The TCP port on which Readeck listens. Update container port above to match (right of colon).
      READECK_SERVER_PORT: 8000
      # Easier to read log format
      READECK_LOG_FORMAT: text
      # Optional, the URL prefix of Readeck.
      # READECK_SERVER_PREFIX: "/"
    volumes:
      - ${SERVER_DATA}/readeck:/readeck
    restart: unless-stopped
    networks:
      - cloudflare-public
    security_opt:
      - no-new-privileges
    healthcheck:
      test: ["CMD", "/bin/readeck", "healthcheck", "-config", "config.toml"]
      interval: 30s
      timeout: 2s
      retries: 3

  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    networks:
      - forgejo
      - caddy-private
    volumes:
      - ${SERVER_DATA}/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:22"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    # ports:
    #   - 3000:3000
    volumes:
      - ./config/homepage:/app/config # Make sure your local config directory exists
      - ${SERVER_DATA}/homepage:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro # (optional) For docker integrations
    networks:
      - cloudflare-public
      - caddy-private
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS} # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts

  vikunja:
    image: vikunja/vikunja
    container_name: vikunja
    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_SERVICE_PUBLICURL}
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SERVICE_SECRET}
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_SERVICE_ENABLEREGISTRATION: false
    # ports:
    #   - 3456:3456
    networks:
      - cloudflare-public
    volumes:
      - ${SERVER_DATA}/vikunja/files:/app/vikunja/files
      - ${SERVER_DATA}/vikunja/db:/db
    restart: unless-stopped

  # 1. Rclone mount to Cloudflare R2
  rclone-r2:
    image: rclone/rclone:latest
    container_name: rclone-r2
    restart: unless-stopped
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - RCLONE_CONFIG_R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - RCLONE_CONFIG_R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - RCLONE_CONFIG_R2_ENDPOINT=${R2_ENDPOINT}
    volumes:
      - ./config/rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - ${SERVER_DATA}/rclone/cache:/root/.cache/rclone
      - ${SERVER_RESOURCES}/library:/data:shared
    command: >
      mount r2:my-digital-library /data
      --allow-other
      --allow-non-empty
      --vfs-cache-mode full
      --vfs-cache-max-size 10G
      --vfs-read-chunk-size 16M
      --vfs-read-chunk-size-limit 64M
      --dir-cache-time 72h
      --attr-timeout 72h

  # 2. BookOrbit PostgreSQL Database
  bookorbit-db:
    image: pgvector/pgvector:pg16
    container_name: bookorbit-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${BOOKORBIT_POSTGRES_USER}
      - POSTGRES_PASSWORD=${BOOKORBIT_POSTGRES_PASSWORD}
      - POSTGRES_DB=${BOOKORBIT_POSTGRES_DB}
    volumes:
      - ${SERVER_DATA}/bookorbit/postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 200M # Strictly caps Postgres memory usage on small hosts
    networks:
      - cloudflare-public

  # 3. BookOrbit Application
  bookorbit:
    image: ghcr.io/bookorbit/bookorbit:latest
    container_name: bookorbit
    restart: unless-stopped
    depends_on:
      - rclone-r2
      - bookorbit-db
    environment:
      - APP_URL=${BOOKORBIT_APP_URL}
      - POSTGRES_HOST=bookorbit-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${BOOKORBIT_POSTGRES_USER}
      - POSTGRES_PASSWORD=${BOOKORBIT_POSTGRES_PASSWORD}
      - POSTGRES_DB=${BOOKORBIT_POSTGRES_DB}
      - JWT_SECRET=${BOOKORBIT_JWT_SECRET}
      - SETUP_BOOTSTRAP_TOKEN=${BOOKORBIT_SETUP_BOOTSTRAP_TOKEN}
      - NODE_MAX_OLD_SPACE_SIZE=512 # Limits Node.js heap allocation
      - PUID=1000
      - PGID=1000
      - LIBRARY_BROWSE_ROOT=/books # Constrains file picker scope inside container
    volumes:
      - ${SERVER_DATA}/bookorbit/app:/data
      - ${SERVER_RESOURCES}/library:/books:slave # R2 Mounted Storage
    deploy:
      resources:
        limits:
          memory: 350M # Hard cap to prevent crashing your server
    networks:
      - cloudflare-public

networks:
  karakeep:
    name: karakeep
  wallabag:
    name: wallabag
  cloudflare-public:
    name: cloudflare-public
  forgejo:
    name: forgejo
  caddy-private:
    name: caddy-private
