name: kashlab

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SERVER_DATA}/portainer:/data
    ports:
      - 9000:9000
      - 9443:9443
      # - 8000:8000  # Remove if you do not intend to use Edge Agents
    profiles:
      - bootstrap
    networks:
      - caddy-private

