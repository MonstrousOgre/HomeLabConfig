  linkding:
    container_name: "${LD_CONTAINER_NAME:-linkding}"
    image: sissbruecker/linkding:latest
    # ports:
    #   - "${LD_HOST_PORT:-9090}:9090"
    volumes:
      - "${LD_HOST_DATA_DIR:-${SERVER_DATA}/linkding}:/etc/linkding/data"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - cloudflare-public

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      - tunnel
      - run
      - --token
      - ${CLOUDFLARE_TOKEN}
    networks:
      - cloudflare-public
  caddy:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.caddy   # Explicitly name your Caddy Dockerfile
    # container_name: caddy
    image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./config/caddy:/etc/caddy:ro
      - ${SERVER_DATA}/caddy/data:/data
      - ${SERVER_DATA}/caddy/config:/config
    networks:
      - caddy-private

