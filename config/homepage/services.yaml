---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

- Public Services:
    - Bookmarks:
        icon: linkding.png # Built-in LinkDing icon
        href: https://bookmarks.kashlab.net/
        description: Bookmark manager & reference saver
        container: linkding # Live Docker status indicator
        target: _blank

    - Read-it-later:
        icon: readeck.png # Built-in Readeck icon
        href: https://read.kashlab.net/
        description: Article archive & OPDS feed provider
        container: readeck
        target: _blank

    - Library:
        icon: sh-bookorbit.png # Native BookOrbit icon via selfh.st
        href: https://library.kashlab.net/
        description: Digital library catalog
        container: bookorbit
        target: _blank

    - Task Manager:
        icon: vikunja.png # Built-in Vikunja icon
        href: https://tasks.kashlab.net/
        description: Task management, time-slots & scheduling
        container: vikunja
        target: _blank

- Private Services:
    - Git:
        icon: forgejo.png # Built-in Forgejo icon
        href: https://git.kashlab.net:8443/
        description: Private self-hosted Git forge
        container: forgejo
        target: _blank
        siteMonitor: http://forgejo:3000 # Shows HTTP latency (ms)

    - Container Management:
        icon: portainer.png # Built-in Portainer icon
        href: https://services.kashlab.net:8443/ # Or your Tailscale URL/IP
        description: Docker container management for the Kash Lab
        container: portainer # Monitors Portainer container health
        target: _blank
        siteMonitor: http://portainer:9000 # Internal Docker HTTP port (or 9443 for HTTPS)
